<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedCheck</title>
  <link rel="icon" href="./windows.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="manifest" href="./site.webmanifest">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.55), transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(236, 72, 153, 0.45), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(34, 197, 94, 0.35), transparent 50%),
        linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #1e1033 100%);
      background-attachment: fixed;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 20px 28px;
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 0 40px rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.08) 50%, transparent 70%);
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px 2px rgba(74, 222, 128, 0.7);
    }

    h1 {
      margin-top: 16px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    .sub {
      margin-top: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .gauge-wrap {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gauge {
      position: relative;
      width: 224px;
      height: 224px;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 4px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 8px solid transparent;
      border-top-color: #60a5fa;
      filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.6));
    }

    .spin {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .num {
      font-size: 48px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .unit {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #cbd5e1;
    }

    .stats {
      margin-top: 24px;
      display: flex;
      gap: 32px;
      justify-content: center;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #f1f5f9;
    }

    .stat-lbl {
      font-size: 12px;
      color: #cbd5e1;
    }

    button {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.55), rgba(129, 140, 248, 0.45));
      color: #fff;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 4px 16px rgba(59, 130, 246, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: transform .15s ease, box-shadow .15s ease, opacity .2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow:
        0 6px 20px rgba(59, 130, 246, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge"><span class="dot"></span> Wi-Fi ulangan</div>
    <h1>SpeedCheck</h1>
    <p class="sub">Internet tarmog'ingiz tezligini tekshiring</p>

    <div class="gauge-wrap">
      <div class="gauge">
        <div class="ring" id="ring"></div>
        <div>
          <div class="num" id="download">0.0</div>
          <div class="unit">Mbps</div>
        </div>
      </div>
      <div class="stats">
        <div>
          <div class="stat-val" id="ping">0 ms</div>
          <div class="stat-lbl">Ping</div>
        </div>
        <div>
          <div class="stat-val" id="quality">—</div>
          <div class="stat-lbl">Sifat</div>
        </div>
      </div>
    </div>

    <button id="btn">Tezlikni tekshirish</button>
    <p class="note">Natijalar taxminiy va tarmoq holatiga bog'liq.</p>
  </div>

  <script>
    var btn = document.getElementById('btn');
    var ring = document.getElementById('ring');
    var dl = document.getElementById('download');
    var pg = document.getElementById('ping');
    var q = document.getElementById('quality');
    var snd = document.getElementById('snd');
    var testing = false;

    btn.addEventListener('click', function () {
      if (testing) return;
      testing = true;
      btn.disabled = true;
      btn.textContent = 'BATTAR BOL DOSTIM...';
      ring.classList.add('spin');
      q.textContent = '—';

      // Ovozni 3 sekund kechiktirib chiqarish
      setTimeout(function () {
        snd.currentTime = 0;
        snd.volume = 1;
        snd.play().catch(function () { });
      }, 800);

      var start = Date.now();
      var iv = setInterval(function () {
        dl.textContent = (Math.random() * 940 + 40).toFixed(1);
        pg.textContent = (Math.floor(Math.random() * 40) + 5) + ' ms';
        if (Date.now() - start >= 2000) {
          clearInterval(iv);
          dl.textContent = (Math.random() * 200 + 700).toFixed(1);
          pg.textContent = (Math.floor(Math.random() * 15) + 4) + ' ms';
          q.textContent = 'A+';
          ring.classList.remove('spin');
          btn.disabled = false;
          btn.textContent = 'ixixixixixixixixixi';
          testing = false;
        }
      }, 90);
    });
